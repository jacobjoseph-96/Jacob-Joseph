# ─────────────────────────────────────────────────────────────────
# GitLab Pages — Jacob Joseph · Portfolio
# Builds Tailwind CSS then deploys the static site.
# ─────────────────────────────────────────────────────────────────

image: node:20-alpine

stages:
  - deploy

pages:
  stage: deploy
  script:
    - echo "// installing dependencies…"
    - npm ci
    - echo "// building Tailwind CSS…"
    - npm run build:css
    - echo "// publishing portfolio to GitLab Pages…"
    - mkdir -p public
    - cp -r index.html style.css assets public/
    - echo "// done — $(find public -type f | wc -l) files published"
  artifacts:
    paths:
      - public
    expire_in: 30 days
  rules:
    # Deploy on every push to the default branch (main).
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
